name: Deploy Gallery to Root

on:
  push:
    branches:
      - main
    paths:
      - 'output/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy gallery to root
        run: |
          cp output/index.html ./index.html
          cp output/news-data.json ./news-data.json

      - name: Commit and push
        run: |
          git config user.name "AI Daily Report Bot"
          git config user.email "daily-report@openclaw.local"
          git add index.html news-data.json
          git diff --cached --quiet || git commit -m "🎨 Auto-deploy gallery to root [skip ci]"
          git push
