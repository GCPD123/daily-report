<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Beauty Report - {{date}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-hover: #0f3460;
      --text-primary: #f1f1f1;
      --text-secondary: #aaaaaa;
      --accent: #e94560;
      --accent-pink: #ff6b9d;
      --border: #2a2a4e;
    }
    
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      min-height: 100vh;
    }
    
    /* 顶部导航栏 */
    .navbar {
      position: sticky;
      top: 0;
      background: rgba(22, 33, 62, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.4em;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .logo-icon {
      font-size: 1.5em;
      -webkit-text-fill-color: initial;
    }
    
    .date-badge {
      background: var(--bg-hover);
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 0.9em;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    
    .stats-bar {
      display: flex;
      gap: 12px;
    }
    
    .stat-item {
      background: var(--bg-hover);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.85em;
      border: 1px solid var(--border);
    }
    
    .stat-number {
      color: var(--accent-pink);
      font-weight: 600;
    }
    
    /* 主容器 */
    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    
    /* 分类标签栏 */
    .category-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      overflow-x: auto;
      padding-bottom: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .category-tab {
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 0.95em;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid var(--border);
    }
    
    .category-tab:hover {
      background: var(--bg-hover);
      transform: translateY(-2px);
    }
    
    .category-tab.active {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-pink) 100%);
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(233, 69, 96, 0.4);
    }
    
    /* 图片网格布局 */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 48px;
    }
    
    /* 图片卡片 */
    .image-card {
      background: var(--bg-secondary);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s;
      border: 1px solid var(--border);
    }
    
    .image-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 32px rgba(233, 69, 96, 0.3);
      border-color: var(--accent);
    }
    
    .image-wrapper {
      position: relative;
      width: 100%;
      height: 400px;
      background: linear-gradient(135deg, #2a2a4e 0%, #1a1a2e 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .image-placeholder {
      font-size: 4em;
      opacity: 0.3;
    }
    
    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    
    .image-card:hover .image-wrapper img {
      transform: scale(1.05);
    }
    
    .image-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .image-card:hover .image-overlay {
      opacity: 1;
    }
    
    .view-icon {
      font-size: 2.5em;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
    }
    
    .image-info {
      padding: 16px;
    }
    
    .image-title {
      font-size: 0.95em;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text-primary);
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .image-source {
      font-size: 0.8em;
      color: var(--text-secondary);
    }
    
    /* 分类标题 */
    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 40px 0 20px;
      padding: 16px 24px;
      background: var(--bg-secondary);
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    
    .category-title {
      font-size: 1.4em;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .category-count {
      background: var(--bg-hover);
      color: var(--accent-pink);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
      border: 1px solid var(--accent);
    }
    
    /* 页脚 */
    footer {
      text-align: center;
      padding: 48px 24px;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.9em;
      background: var(--bg-secondary);
    }
    
    footer p {
      margin: 4px 0;
    }
    
    /* 响应式 */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        gap: 12px;
        padding: 16px;
      }
      
      .stats-bar {
        flex-wrap: wrap;
        justify-content: center;
      }
      
      .image-grid {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 16px;
      }
      
      .image-wrapper {
        height: 350px;
      }
      
      .container {
        padding: 16px;
      }
      
      .category-tabs {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <!-- 顶部导航栏 -->
  <nav class="navbar">
    <div class="logo">
      <span class="logo-icon">✨</span>
      <span>Daily Beauty Report</span>
    </div>
    <div class="date-badge">{{date}}</div>
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-number">{{totalCount}}</span> 张图片
      </div>
      <div class="stat-item">
        <span class="stat-number">{{categoryCount}}</span> 个分类
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- 分类标签 -->
    <div class="category-tabs">
      {{categoryTabs}}
    </div>

    {{categories}}
  </div>

  <footer>
    <p>Generated by Daily Beauty Report · {{year}}</p>
    <p style="margin-top: 8px; opacity: 0.7;">图片来自互联网 · 每日早 8 点自动更新</p>
  </footer>
</body>
</html>
