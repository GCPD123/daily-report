<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Daily Report - {{date}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #272727;
      --bg-hover: #3d3d3d;
      --text-primary: #ffffff;
      --text-secondary: #aaaaaa;
      --accent: #3ea6ff;
      --border: #3f3f3f;
    }
    
    body {
      font-family: 'Roboto', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }
    
    /* 顶部导航栏 */
    .navbar {
      position: sticky;
      top: 0;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.3em;
      font-weight: 600;
    }
    
    .logo-icon {
      font-size: 1.5em;
    }
    
    .date-display {
      background: var(--bg-hover);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9em;
      color: var(--text-secondary);
    }
    
    .stats-bar {
      margin-left: auto;
      display: flex;
      gap: 20px;
    }
    
    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9em;
      color: var(--text-secondary);
    }
    
    .stat-number {
      font-weight: 600;
      color: var(--text-primary);
    }
    
    /* 主容器 */
    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px;
    }
    
    /* 分类区块 */
    .category-section {
      margin-bottom: 40px;
    }
    
    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }
    
    .category-icon {
      font-size: 1.5em;
    }
    
    .category-title {
      font-size: 1.4em;
      font-weight: 600;
    }
    
    .category-count {
      background: var(--accent);
      color: #000;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.8em;
      font-weight: 600;
    }
    
    /* 新闻网格 - YouTube 风格 */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    
    .news-card {
      background: var(--bg-secondary);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, background 0.2s;
      cursor: pointer;
      border: 1px solid transparent;
    }
    
    .news-card:hover {
      transform: translateY(-2px);
      background: var(--bg-hover);
      border-color: var(--border);
    }
    
    .news-thumbnail {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .news-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .thumbnail-placeholder {
      font-size: 3em;
      opacity: 0.5;
    }
    
    .news-content {
      padding: 12px;
    }
    
    .news-title {
      font-size: 0.95em;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .news-title a {
      color: var(--text-primary);
      text-decoration: none;
    }
    
    .news-title a:hover {
      color: var(--accent);
    }
    
    .news-snippet {
      font-size: 0.85em;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .news-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .news-source {
      background: var(--bg-hover);
      color: var(--text-secondary);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75em;
      font-weight: 500;
    }
    
    .translated-badge {
      background: linear-gradient(135deg, #00b894, #00cec9);
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.7em;
      font-weight: 600;
    }
    
    .news-url {
      font-size: 0.75em;
      color: var(--accent);
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    /* 重点分类高亮 */
    .featured .category-header {
      border-bottom-color: var(--accent);
    }
    
    /* 页脚 */
    footer {
      text-align: center;
      padding: 40px 24px;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      margin-top: 60px;
    }
    
    footer p {
      margin: 8px 0;
      font-size: 0.9em;
    }
    
    /* 响应式 */
    @media (max-width: 768px) {
      .navbar {
        flex-wrap: wrap;
        padding: 12px 16px;
        gap: 12px;
      }
      .stats-bar {
        margin-left: 0;
        width: 100%;
        justify-content: space-around;
      }
      .container {
        padding: 16px;
      }
      .news-grid {
        grid-template-columns: 1fr;
      }
      .category-title {
        font-size: 1.2em;
      }
    }
    
    /* 加载动画 */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .loading {
      animation: pulse 1.5s infinite;
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <nav class="navbar">
    <div class="logo">
      <span class="logo-icon">📰</span>
      <span>AI Daily Report</span>
    </div>
    <div class="date-display">{{date}}</div>
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-number">{{totalCount}}</span>
        <span>条资讯</span>
      </div>
      <div class="stat-item">
        <span class="stat-number">{{categoryCount}}</span>
        <span>个分类</span>
      </div>
      <div class="stat-item">
        <span class="stat-number">{{translatedCount}}</span>
        <span>已翻译</span>
      </div>
    </div>
  </nav>
  
  <!-- 主内容 -->
  <div class="container">
    {{categories}}
  </div>
  
  <!-- 页脚 -->
  <footer>
    <p>Generated by AI Daily Report · {{year}}</p>
    <p>数据来自 Tavily · 每日早 8 点自动更新 · 自动翻译</p>
  </footer>
</body>
</html>
