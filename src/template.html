<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Daily Report - {{date}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    header h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .date-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 1.1em;
      margin-top: 10px;
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .stat-item {
      background: rgba(255,255,255,0.15);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 0.95em;
    }
    .stat-number {
      font-weight: bold;
      font-size: 1.3em;
    }
    .category {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .category-header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 3px solid #667eea;
    }
    .category-icon {
      font-size: 1.8em;
      margin-right: 12px;
    }
    .category-title {
      font-size: 1.4em;
      color: #333;
      font-weight: 600;
    }
    .category-count {
      margin-left: auto;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
    }
    .news-item {
      padding: 18px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .news-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .news-title {
      font-size: 1.05em;
      color: #2c3e50;
      margin-bottom: 8px;
      line-height: 1.5;
      font-weight: 500;
    }
    .news-title a {
      color: #667eea;
      text-decoration: none;
      transition: all 0.2s;
    }
    .news-title a:hover {
      color: #764ba2;
      text-decoration: underline;
    }
    .news-snippet {
      color: #666;
      font-size: 0.9em;
      line-height: 1.6;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .news-source {
      background: #f5f5f5;
      color: #666;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.8em;
    }
    .translated-badge {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75em;
      font-weight: 600;
    }
    .top-news {
      background: linear-gradient(135deg, #fff5e6 0%, #ffe6f0 100%);
      border: 2px solid #ffb6c1;
    }
    .top-news .category-header {
      border-bottom-color: #ff6b8a;
    }
    footer {
      text-align: center;
      color: white;
      margin-top: 40px;
      opacity: 0.9;
      font-size: 0.9em;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📰 AI Daily Report</h1>
      <div class="date-badge">{{date}}</div>
      <div class="stats">
        <div class="stat-item">
          <span class="stat-number">{{totalCount}}</span> 条资讯
        </div>
        <div class="stat-item">
          <span class="stat-number">{{categoryCount}}</span> 个分类
        </div>
      </div>
    </header>

    {{categories}}

    <footer>
      <p>Generated by AI Daily Report · {{year}}</p>
      <p style="margin-top: 8px; opacity: 0.7;">数据来自 Tavily · 每日早 8 点自动更新</p>
    </footer>
  </div>
</body>
</html>
