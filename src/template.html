<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Daily Report - {{date}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }
    header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    header p {
      font-size: 1.1em;
      opacity: 0.9;
    }
    .category {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .category-header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f0f0f0;
    }
    .category-icon {
      font-size: 1.8em;
      margin-right: 12px;
    }
    .category-title {
      font-size: 1.5em;
      color: #333;
      font-weight: 600;
    }
    .category-count {
      margin-left: auto;
      background: #667eea;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.9em;
    }
    .news-item {
      padding: 16px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .news-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .news-title {
      font-size: 1.1em;
      color: #2c3e50;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .news-title a {
      color: #667eea;
      text-decoration: none;
      transition: color 0.2s;
    }
    .news-title a:hover {
      color: #764ba2;
      text-decoration: underline;
    }
    .news-snippet {
      color: #666;
      font-size: 0.95em;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .news-meta {
      display: flex;
      gap: 16px;
      font-size: 0.85em;
      color: #999;
    }
    .news-source {
      background: #f5f5f5;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .translated-badge {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8em;
    }
    footer {
      text-align: center;
      color: white;
      margin-top: 40px;
      opacity: 0.8;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📰 AI Daily Report</h1>
      <p>{{date}} · 共 {{totalCount}} 条资讯</p>
    </header>

    {{categories}}

    <footer>
      <p>Generated by AI Daily Report · {{year}}</p>
    </footer>
  </div>
</body>
</html>
