<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Daily Report - {{date}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1f1f1f;
      --bg-hover: #2f2f2f;
      --text-primary: #f1f1f1;
      --text-secondary: #aaaaaa;
      --accent: #3ea6ff;
      --border: #303030;
    }
    
    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }
    
    /* 顶部导航栏 */
    .navbar {
      position: sticky;
      top: 0;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.3em;
      font-weight: 600;
    }
    
    .logo-icon {
      font-size: 1.5em;
    }
    
    .date-badge {
      background: var(--bg-hover);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9em;
      color: var(--text-secondary);
    }
    
    .stats-bar {
      display: flex;
      gap: 16px;
    }
    
    .stat-item {
      background: var(--bg-hover);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85em;
    }
    
    .stat-number {
      color: var(--accent);
      font-weight: 600;
    }
    
    /* 主容器 */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }
    
    /* 分类标签栏 */
    .category-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    
    .category-tab {
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9em;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid var(--border);
    }
    
    .category-tab:hover {
      background: var(--bg-hover);
    }
    
    .category-tab.active {
      background: var(--accent);
      border-color: var(--accent);
    }
    
    /* 视频网格布局 */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    
    /* 视频卡片 */
    .video-card {
      background: transparent;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .video-card:hover {
      transform: translateY(-4px);
    }
    
    .thumbnail {
      position: relative;
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .thumbnail-placeholder {
      font-size: 3em;
      opacity: 0.5;
    }
    
    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .duration-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75em;
      font-weight: 500;
    }
    
    .translated-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(46, 125, 50, 0.9);
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7em;
      font-weight: 600;
    }
    
    .video-info {
      display: flex;
      gap: 12px;
      padding: 12px 0;
    }
    
    .channel-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2em;
      flex-shrink: 0;
    }
    
    .video-details {
      flex: 1;
      min-width: 0;
    }
    
    .video-title {
      font-size: 0.95em;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text-primary);
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .video-title a {
      color: inherit;
      text-decoration: none;
    }
    
    .video-title a:hover {
      color: var(--accent);
    }
    
    .channel-name {
      font-size: 0.85em;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    
    .video-meta {
      font-size: 0.8em;
      color: var(--text-secondary);
    }
    
    /* 分类标题 */
    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 32px 0 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    
    .category-icon {
      font-size: 1.5em;
    }
    
    .category-title {
      font-size: 1.3em;
      font-weight: 600;
    }
    
    .category-count {
      background: var(--bg-hover);
      color: var(--text-secondary);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8em;
    }
    
    /* 页脚 */
    footer {
      text-align: center;
      padding: 40px 24px;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.9em;
    }
    
    /* 响应式 */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        gap: 12px;
        padding: 12px 16px;
      }
      
      .stats-bar {
        display: none;
      }
      
      .video-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      
      .thumbnail {
        height: 200px;
      }
      
      .container {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <!-- 顶部导航栏 -->
  <nav class="navbar">
    <div class="logo">
      <span class="logo-icon">📰</span>
      <span>AI Daily Report</span>
    </div>
    <div class="date-badge">{{date}}</div>
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-number">{{totalCount}}</span> 条资讯
      </div>
      <div class="stat-item">
        <span class="stat-number">{{categoryCount}}</span> 个分类
      </div>
      <div class="stat-item">
        <span class="stat-number">{{translatedCount}}</span> 已翻译
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- 分类标签 -->
    <div class="category-tabs">
      {{categoryTabs}}
    </div>

    {{categories}}
  </div>

  <footer>
    <p>Generated by AI Daily Report · {{year}}</p>
    <p style="margin-top: 8px; opacity: 0.7;">数据来自 Tavily · 每日早 8 点自动更新</p>
  </footer>
</body>
</html>
