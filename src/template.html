<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Daily Report - {{date}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    
    /* 头部 - 桌面端 */
    header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    header h1 {
      font-size: 2em;
      margin-bottom: 15px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .date-badge {
      display: inline-block;
      background: rgba(255,255,255,0.25);
      padding: 10px 24px;
      border-radius: 25px;
      font-size: 1.1em;
      font-weight: 500;
      margin: 10px 0;
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .stat-item {
      background: rgba(255,255,255,0.15);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.95em;
    }
    .stat-number {
      font-weight: bold;
      font-size: 1.4em;
      display: block;
    }
    .stat-label {
      font-size: 0.85em;
      opacity: 0.9;
    }
    
    /* 分类卡片 */
    .category {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .category-header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 3px solid #667eea;
    }
    .category-icon {
      font-size: 1.8em;
      margin-right: 12px;
    }
    .category-title {
      font-size: 1.4em;
      color: #333;
      font-weight: 600;
    }
    .category-count {
      margin-left: auto;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
    }
    
    /* 新闻列表 - 桌面端网格布局 */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .news-card {
      background: #fafafa;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #eee;
    }
    .news-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }
    .news-image {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .news-image-placeholder {
      width: 100%;
      height: 160px;
      background: linear-gradient(135deg, #e0e5ec 0%, #f5f8fa 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 2em;
    }
    .news-content {
      padding: 16px;
    }
    .news-title {
      font-size: 1em;
      color: #2c3e50;
      margin-bottom: 10px;
      line-height: 1.5;
      font-weight: 500;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-title a {
      color: #667eea;
      text-decoration: none;
      transition: color 0.2s;
    }
    .news-title a:hover {
      color: #764ba2;
      text-decoration: underline;
    }
    .news-snippet {
      color: #666;
      font-size: 0.85em;
      line-height: 1.6;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .news-source {
      background: #e8e8e8;
      color: #555;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75em;
      font-weight: 500;
    }
    .translated-badge {
      background: linear-gradient(135deg, #4caf50 0%, #8bc34a 100%);
      color: white;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.7em;
      font-weight: 600;
    }
    
    /* 重点新闻高亮 */
    .top-news {
      background: linear-gradient(135deg, #fff5f7 0%, #fff0f5 100%);
      border: 2px solid #ffb6c1;
    }
    .top-news .category-header {
      border-bottom-color: #ff6b8a;
    }
    
    /* 页脚 */
    footer {
      text-align: center;
      color: white;
      margin-top: 40px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 25px;
    }
    footer p {
      margin: 5px 0;
    }
    
    /* ========== 移动端适配 ========== */
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }
      header {
        padding: 20px 15px;
      }
      header h1 {
        font-size: 1.5em;
      }
      .date-badge {
        font-size: 0.95em;
        padding: 8px 16px;
      }
      .stats {
        gap: 10px;
      }
      .stat-item {
        padding: 8px 16px;
        flex: 1;
        min-width: 120px;
      }
      .stat-number {
        font-size: 1.2em;
      }
      .category {
        padding: 16px;
      }
      .category-title {
        font-size: 1.2em;
      }
      /* 移动端单列布局 */
      .news-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }
      .news-image,
      .news-image-placeholder {
        height: 180px;
      }
      .news-content {
        padding: 14px;
      }
      .news-title {
        font-size: 0.95em;
      }
      .news-snippet {
        font-size: 0.8em;
        -webkit-line-clamp: 2;
      }
    }
    
    /* 超小屏幕 */
    @media (max-width: 480px) {
      header h1 {
        font-size: 1.3em;
      }
      .date-badge {
        font-size: 0.85em;
        padding: 6px 12px;
      }
      .category-icon {
        font-size: 1.4em;
      }
      .category-title {
        font-size: 1.1em;
      }
      .news-image,
      .news-image-placeholder {
        height: 150px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📰 AI Daily Report</h1>
      <div class="date-badge">{{date}}</div>
      <div class="stats">
        <div class="stat-item">
          <span class="stat-number">{{totalCount}}</span>
          <span class="stat-label">条资讯</span>
        </div>
        <div class="stat-item">
          <span class="stat-number">{{categoryCount}}</span>
          <span class="stat-label">个分类</span>
        </div>
        <div class="stat-item">
          <span class="stat-number">{{translatedCount}}</span>
          <span class="stat-label">已翻译</span>
        </div>
      </div>
    </header>

    {{categories}}

    <footer>
      <p>Generated by AI Daily Report · {{year}}</p>
      <p style="margin-top: 8px; opacity: 0.7;">数据来自 Tavily · 每日早 8 点自动更新 · 自动翻译</p>
    </footer>
  </div>
</body>
</html>
